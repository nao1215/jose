version: 2
project_name: jose
env:
  - GO111MODULE=on
before:
  hooks:
    - go mod tidy
    #- go generate ./...
builds:
  - main: .
    ldflags:
      - -s -w -X 'github.com/nao1215/jose/cmd.Version=v{{ .Version }}'
    env:
      - CGO_ENABLED=0
      # jwx v4 uses encoding/json/v2, gated behind this experiment on Go 1.26.
      - GOEXPERIMENT=jsonv2
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
release:
  # A re-run of the release workflow (for example after a failed Homebrew
  # step) re-uploads every artifact. Replace the ones already on the release
  # instead of failing on "already_exists", so the re-run reaches the steps
  # that failed.
  replace_existing_artifacts: true
checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
nfpms:
  - maintainer: Naohiro CHIKAMATSU <n.chika156@gmail.com>
    description: jose - CLI tool for JOSE (JSON Object Signing and Encryption)
    homepage: https://nao1215.github.io/jose/
    license: MIT License
    formats:
      - deb
      - rpm
      - apk
brews:
  - name: jose
    description: CLI tool for JOSE - generate JWK/JWKS, sign and verify JWS, encrypt and decrypt JWE
    homepage: https://nao1215.github.io/jose/
    license: MIT
    repository:
      owner: nao1215
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    install: |-
      bin.install "jose"
    test: |
      system "#{bin}/jose", "version"
