name: MultiPlatformUnitTest

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # jwx v4 uses encoding/json/v2, gated behind this experiment on Go 1.26.
  GOEXPERIMENT: jsonv2

# These jobs only read the checkout; nothing here publishes or writes back.
permissions:
  contents: read

# A new push to a pull request cancels the run for the previous commit, so
# superseded runs do not hold the account's shared job slots.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit_test:
    name: Unit test (${{ matrix.os }}, Go ${{ matrix.go }})

    # The matrix is the floor and the ceiling of the supported Go range on the
    # three operating systems GitHub hosts runners for. The floor is what
    # go.mod declares (jwx v4 needs encoding/json/v2, which is gated behind
    # GOEXPERIMENT=jsonv2 on Go 1.26), and running it here is the only place
    # that claim is checked. "stable" tracks the newest release, which is what
    # catches new vet checks and runtime behavior changes -- note it is
    # "stable" and not "1", because setup-go resolves "1" from its own
    # manifest, which lags behind a fresh Go release. Every non-test workflow
    # uses "stable" too: go.mod states the oldest Go a user may build jose
    # from, not the toolchain CI should ship artifacts with.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26.10", "stable"]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      # Coverage reporting to octocov lives in the dedicated Coverage workflow
      # (.github/workflows/coverage.yml), which reports the combined unit + E2E
      # number. -count=1 keeps a restored build cache from replaying old test
      # results.
      - name: Run unit tests
        run: go test -race -count=1 ./...
