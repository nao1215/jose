name: Fuzz

# Pull requests and pushes run each Fuzz target for a short smoke run. The
# nightly schedule is the part that actually searches: `go test` alone only
# replays the seed corpus and testdata/fuzz/, so without it no new input is
# ever tried. The search length per target can be set on a manual run.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      # A choice rather than free text: the targets run one after another in
      # a single 45-minute job, so five targets at 5m is the longest run
      # that still finishes before the timeout.
      fuzztime:
        description: "go test -fuzztime per target"
        type: choice
        options: ["20s", "1m", "5m"]
        default: "5m"
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # jwx v4 uses encoding/json/v2, gated behind this experiment on Go 1.26.
  GOEXPERIMENT: jsonv2

# These jobs only read the checkout; nothing here publishes or writes back.
permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    # Five targets at 5m each on the nightly run, plus the build.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Run fuzz targets
        env:
          FUZZTIME: ${{ inputs.fuzztime || (github.event_name == 'schedule' && '5m') || '20s' }}
        run: make test-fuzz FUZZ_TIME="$FUZZTIME"

      # A failing input is written under testdata/fuzz/<Name>/. Download it,
      # commit it next to the target, and fix the bug with it as the
      # regression test.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
