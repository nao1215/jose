name: Fuzz

# Pull requests and pushes run each Fuzz target for a short smoke run. The
# nightly schedule is the part that actually searches: `go test` alone only
# replays the seed corpus and testdata/fuzz/, so without it no new input is
# ever tried. The search length per target can be set on a manual run.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      # A choice rather than free text, so a manual run stays within the
      # 15-minute timeout of each target's job.
      fuzztime:
        description: "go test -fuzztime per target"
        type: choice
        options: ["20s", "1m", "5m"]
        default: "5m"
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # jwx v4 uses encoding/json/v2, gated behind this experiment on Go 1.26.
  GOEXPERIMENT: jsonv2

# These jobs only read the checkout; nothing here publishes or writes back.
permissions:
  contents: read

# A new push to a pull request cancels the run for the previous commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    # One target per job, so the run takes as long as one target instead of
    # the five in a row. Keep the list in step with the Fuzz functions in
    # internal/cmd/fuzz_test.go and with `make test-fuzz`.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzJWSParse
          - FuzzJWSVerify
          - FuzzJWEDecrypt
          - FuzzGetKeyFile
          - FuzzSignOptionsHeader

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Run ${{ matrix.target }}
        env:
          FUZZTIME: ${{ inputs.fuzztime || (github.event_name == 'schedule' && '5m') || '20s' }}
          TARGET: ${{ matrix.target }}
        run: go test ./internal/cmd/ -run="^${TARGET}$" -fuzz="^${TARGET}$" -fuzztime="$FUZZTIME"

      # A failing input is written under testdata/fuzz/<Name>/. Download it,
      # commit it next to the target, and fix the bug with it as the
      # regression test.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashers-${{ matrix.target }}
          path: "**/testdata/fuzz/**"
