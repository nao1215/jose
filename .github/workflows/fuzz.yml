name: Fuzz

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # jwx v4 uses encoding/json/v2, gated behind this experiment on Go 1.26.
  GOEXPERIMENT: jsonv2

# These jobs only read the checkout; nothing here publishes or writes back.
permissions:
  contents: read

jobs:
  fuzz:
    name: Short fuzz smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"

      - name: Run fuzz targets for a short time
        run: make test-fuzz FUZZ_TIME=20s
