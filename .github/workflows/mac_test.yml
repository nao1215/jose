name: MacUnitTest

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # jwx v4 uses encoding/json/v2, gated behind this experiment on Go 1.26.
  GOEXPERIMENT: jsonv2

jobs:
  unit_test:
    name: Unit test (mac)

    # The matrix is the floor and the ceiling of the supported Go range. The
    # floor is what go.mod declares (jwx v4 needs encoding/json/v2, which is
    # gated behind GOEXPERIMENT=jsonv2 on Go 1.26), and running it here is the
    # only place that claim is checked. "stable" tracks the newest release,
    # which is what catches new vet checks and runtime behavior changes -- note
    # it is "stable" and not "1", because setup-go resolves "1" from its own
    # manifest, which lags behind a fresh Go release. Every non-test workflow
    # uses "stable" too: go.mod states the oldest Go a user may build jose
    # from, not the toolchain CI should ship artifacts with.
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest]
        go: ["1.26", "stable"]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Run unit test
        run: |
          go mod download
          go test -race -v ./...
