# Trivy reads this file from the working directory for its secret scanner.
# The default rules apply; the allow rule only covers the e2e snapshots, which
# are JWS tokens jose signs with the throwaway test keys in
# e2e/atago/snapshot.atago.yaml. .gitleaks.toml allows the same files.
allow-rules:
  - id: e2e-snapshot-tokens
    description: JWS tokens in the e2e snapshots, signed with test keys
    path: ^e2e/atago/snapshots/jws_sign_[a-z0-9_]+\.txt$
