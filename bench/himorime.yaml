# yaml-language-server: $schema=https://raw.githubusercontent.com/nao1215/himorime/main/schema/himorime.schema.json
#
# jose measured end to end with himorime (https://github.com/nao1215/himorime):
# the process a user starts, from its first instruction to its exit.
#
#   make bench          measure the working tree
#   make bench-compare  compare main with the working tree
#
# On a pull request, .github/workflows/bench.yml runs `himorime ci bench`:
# the base of the pull request and its head are built and measured in
# interleaved rounds on the same runner. See bench/README.md.
#
# Payloads are generated by gen.sh before measuring. Both revisions run the
# working tree's gen.sh (${head_root}), so they read the same bytes. Keys and
# the tokens to verify or decrypt are written in setup by the jose of the
# revision measured, so no private key is committed.
#
# jose works on one message per call, so the size in a benchmark name is the
# size of the payload: 1kb, where start-up dominates, and 10mb, where hashing
# and encryption do.
version: "1"

name: jose
description: Start-up, key generation, signing and verifying (JWS), and encrypting and decrypting (JWE) payloads of 1 KiB and 10 MiB.

build:
  command: [go, build, -trimpath, -o, "${artifact}", .]
  cwd: ..
  # jwx v4 uses encoding/json/v2, gated behind GOEXPERIMENT=jsonv2 on Go 1.26;
  # the Makefile builds with it too.
  env:
    GOEXPERIMENT: jsonv2

defaults:
  warmup: 2
  runs: 20
  # jose reads no configuration, but keep HOME inside the benchmark's own
  # directory so nothing of the developer's environment can leak in.
  env:
    HOME: "${workdir}"
    XDG_CONFIG_HOME: "${workdir}/.config"
  metrics:
    cpu: true
    memory: true
  regression:
    confidence: 0.95
    latency:
      max_percent: 10
      min_difference: 1ms
    cpu_total:
      max_percent: 15
      min_difference: 2ms
    peak_rss:
      max_percent: 15
      min_difference: 2MiB

benchmarks:
  - name: version
    description: Starting jose and exiting.
    tags: [smoke]
    commands:
      jose:
        command: ["${artifact}", version]

  # One call writes one key; there is no size to vary, so the name carries
  # no count. RSA searches for primes, so its time varies from run to run
  # more than the others.
  - name: jwk generate
    description: One private key of each type written to standard output as a JWK.
    tags: [smoke]
    baseline: ec
    commands:
      ec:
        command: ["${artifact}", jwk, generate, --type, EC, --curve, P-256]
      okp:
        command: ["${artifact}", jwk, generate, --type, OKP, --curve, Ed25519]
      oct:
        command: ["${artifact}", jwk, generate, --type, oct, --size, "256"]
      rsa:
        command: ["${artifact}", jwk, generate, --type, RSA, --size, "2048"]

  - name: jws sign 1kb
    description: A payload of 1 KiB signed with ES256, RS256, EdDSA and HS256. Start-up and reading the key dominate.
    tags: [smoke]
    setup:
      - command: [sh, "${head_root}/gen.sh", payload, "1024", "${workdir}/payload.json"]
      - command: [sh, "${head_root}/gen.sh", keys, "${artifact}", "${workdir}"]
    baseline: es256
    commands:
      es256:
        command: ["${artifact}", jws, sign, --algorithm, ES256, --key, "${workdir}/ec.jwk", "${workdir}/payload.json"]
      rs256:
        command: ["${artifact}", jws, sign, --algorithm, RS256, --key, "${workdir}/rsa.jwk", "${workdir}/payload.json"]
      eddsa:
        command: ["${artifact}", jws, sign, --algorithm, EdDSA, --key, "${workdir}/okp.jwk", "${workdir}/payload.json"]
      hs256:
        command: ["${artifact}", jws, sign, --algorithm, HS256, --key, "${workdir}/oct.jwk", "${workdir}/payload.json"]

  - name: jws sign 10mb
    description: A payload of 10 MiB signed with ES256, RS256, EdDSA and HS256, which hashes and base64-encodes it.
    tags: [large]
    setup:
      - command: [sh, "${head_root}/gen.sh", payload, "10485760", "${workdir}/payload.json"]
      - command: [sh, "${head_root}/gen.sh", keys, "${artifact}", "${workdir}"]
    baseline: es256
    metrics:
      throughput:
        work:
          file_size: "${workdir}/payload.json"
    commands:
      es256:
        command: ["${artifact}", jws, sign, --algorithm, ES256, --key, "${workdir}/ec.jwk", "${workdir}/payload.json"]
      rs256:
        command: ["${artifact}", jws, sign, --algorithm, RS256, --key, "${workdir}/rsa.jwk", "${workdir}/payload.json"]
      eddsa:
        command: ["${artifact}", jws, sign, --algorithm, EdDSA, --key, "${workdir}/okp.jwk", "${workdir}/payload.json"]
      hs256:
        command: ["${artifact}", jws, sign, --algorithm, HS256, --key, "${workdir}/oct.jwk", "${workdir}/payload.json"]

  - name: jws verify 1kb
    description: A compact JWS of a 1 KiB payload verified with ES256, RS256, EdDSA and HS256, printing the payload.
    tags: [smoke]
    setup:
      - command: [sh, "${head_root}/gen.sh", payload, "1024", "${workdir}/payload.json"]
      - command: [sh, "${head_root}/gen.sh", keys, "${artifact}", "${workdir}"]
      - command:
          - sh
          - -c
          - |
            set -e
            "$1" jws sign --algorithm ES256 --key "$2/ec.jwk" "$2/payload.json" > "$2/es256.jws"
            "$1" jws sign --algorithm RS256 --key "$2/rsa.jwk" "$2/payload.json" > "$2/rs256.jws"
            "$1" jws sign --algorithm EdDSA --key "$2/okp.jwk" "$2/payload.json" > "$2/eddsa.jws"
            "$1" jws sign --algorithm HS256 --key "$2/oct.jwk" "$2/payload.json" > "$2/hs256.jws"
          - sh
          - "${artifact}"
          - "${workdir}"
    baseline: es256
    commands:
      es256:
        command: ["${artifact}", jws, verify, --algorithm, ES256, --key, "${workdir}/ec.jwk", "${workdir}/es256.jws"]
      rs256:
        command: ["${artifact}", jws, verify, --algorithm, RS256, --key, "${workdir}/rsa.jwk", "${workdir}/rs256.jws"]
      eddsa:
        command: ["${artifact}", jws, verify, --algorithm, EdDSA, --key, "${workdir}/okp.jwk", "${workdir}/eddsa.jws"]
      hs256:
        command: ["${artifact}", jws, verify, --algorithm, HS256, --key, "${workdir}/oct.jwk", "${workdir}/hs256.jws"]

  - name: jws verify 10mb
    description: A compact JWS of a 10 MiB payload verified with ES256, RS256, EdDSA and HS256, which decodes and hashes it.
    tags: [large]
    setup:
      - command: [sh, "${head_root}/gen.sh", payload, "10485760", "${workdir}/payload.json"]
      - command: [sh, "${head_root}/gen.sh", keys, "${artifact}", "${workdir}"]
      - command:
          - sh
          - -c
          - |
            set -e
            "$1" jws sign --algorithm ES256 --key "$2/ec.jwk" "$2/payload.json" > "$2/es256.jws"
            "$1" jws sign --algorithm RS256 --key "$2/rsa.jwk" "$2/payload.json" > "$2/rs256.jws"
            "$1" jws sign --algorithm EdDSA --key "$2/okp.jwk" "$2/payload.json" > "$2/eddsa.jws"
            "$1" jws sign --algorithm HS256 --key "$2/oct.jwk" "$2/payload.json" > "$2/hs256.jws"
          - sh
          - "${artifact}"
          - "${workdir}"
    baseline: es256
    metrics:
      throughput:
        work:
          file_size: "${workdir}/payload.json"
    commands:
      es256:
        command: ["${artifact}", jws, verify, --algorithm, ES256, --key, "${workdir}/ec.jwk", "${workdir}/es256.jws"]
      rs256:
        command: ["${artifact}", jws, verify, --algorithm, RS256, --key, "${workdir}/rsa.jwk", "${workdir}/rs256.jws"]
      eddsa:
        command: ["${artifact}", jws, verify, --algorithm, EdDSA, --key, "${workdir}/okp.jwk", "${workdir}/eddsa.jws"]
      hs256:
        command: ["${artifact}", jws, verify, --algorithm, HS256, --key, "${workdir}/oct.jwk", "${workdir}/hs256.jws"]

  - name: jws verify error
    description: A JWS verified with an EC key other than the one that signed it, which fails with exit 1.
    tags: [smoke]
    setup:
      - command: [sh, "${head_root}/gen.sh", payload, "1024", "${workdir}/payload.json"]
      - command: [sh, "${head_root}/gen.sh", keys, "${artifact}", "${workdir}"]
      - command: [sh, -c, '"$1" jws sign --algorithm ES256 --key "$2/ec.jwk" "$2/payload.json" > "$2/es256.jws"', sh, "${artifact}", "${workdir}"]
    exit_codes: [1]
    commands:
      jose:
        command: ["${artifact}", jws, verify, --algorithm, ES256, --key, "${workdir}/other-ec.jwk", "${workdir}/es256.jws"]

  - name: jws parse 10mb
    description: A compact JWS of a 10 MiB payload parsed without verifying, printing the payload, headers and signature.
    tags: [large]
    setup:
      - command: [sh, "${head_root}/gen.sh", payload, "10485760", "${workdir}/payload.json"]
      - command: [sh, "${head_root}/gen.sh", keys, "${artifact}", "${workdir}"]
      - command: [sh, -c, '"$1" jws sign --algorithm ES256 --key "$2/ec.jwk" "$2/payload.json" > "$2/es256.jws"', sh, "${artifact}", "${workdir}"]
    metrics:
      throughput:
        work:
          file_size: "${workdir}/payload.json"
    commands:
      jose:
        command: ["${artifact}", jws, parse, --all, "${workdir}/es256.jws"]

  - name: jwe encrypt 1kb
    description: >-
      A payload of 1 KiB encrypted with A256GCM, the content key wrapped with
      ECDH-ES (EC), RSA-OAEP-256 (RSA) and A256KW (oct), and deflated first
      with ECDH-ES.
    tags: [smoke]
    setup:
      - command: [sh, "${head_root}/gen.sh", payload, "1024", "${workdir}/payload.json"]
      - command: [sh, "${head_root}/gen.sh", keys, "${artifact}", "${workdir}"]
    baseline: ecdh-es
    commands:
      ecdh-es:
        command: ["${artifact}", jwe, encrypt, --key, "${workdir}/ec.jwk", --key-encryption, ECDH-ES, --content-encryption, A256GCM, "${workdir}/payload.json"]
      rsa-oaep-256:
        command: ["${artifact}", jwe, encrypt, --key, "${workdir}/rsa.jwk", --key-encryption, RSA-OAEP-256, --content-encryption, A256GCM, "${workdir}/payload.json"]
      a256kw:
        command: ["${artifact}", jwe, encrypt, --key, "${workdir}/oct.jwk", --key-encryption, A256KW, --content-encryption, A256GCM, "${workdir}/payload.json"]
      compress:
        command: ["${artifact}", jwe, encrypt, --key, "${workdir}/ec.jwk", --key-encryption, ECDH-ES, --content-encryption, A256GCM, --compress, "${workdir}/payload.json"]

  - name: jwe encrypt 10mb
    description: A payload of 10 MiB encrypted the same four ways as jwe encrypt 1kb.
    tags: [large]
    setup:
      - command: [sh, "${head_root}/gen.sh", payload, "10485760", "${workdir}/payload.json"]
      - command: [sh, "${head_root}/gen.sh", keys, "${artifact}", "${workdir}"]
    baseline: ecdh-es
    metrics:
      throughput:
        work:
          file_size: "${workdir}/payload.json"
    commands:
      ecdh-es:
        command: ["${artifact}", jwe, encrypt, --key, "${workdir}/ec.jwk", --key-encryption, ECDH-ES, --content-encryption, A256GCM, "${workdir}/payload.json"]
      rsa-oaep-256:
        command: ["${artifact}", jwe, encrypt, --key, "${workdir}/rsa.jwk", --key-encryption, RSA-OAEP-256, --content-encryption, A256GCM, "${workdir}/payload.json"]
      a256kw:
        command: ["${artifact}", jwe, encrypt, --key, "${workdir}/oct.jwk", --key-encryption, A256KW, --content-encryption, A256GCM, "${workdir}/payload.json"]
      compress:
        command: ["${artifact}", jwe, encrypt, --key, "${workdir}/ec.jwk", --key-encryption, ECDH-ES, --content-encryption, A256GCM, --compress, "${workdir}/payload.json"]

  - name: jwe decrypt 1kb
    description: A compact JWE of a 1 KiB payload decrypted, reading the key encryption from its header, for each way jwe encrypt 1kb encrypts.
    tags: [smoke]
    setup:
      - command: [sh, "${head_root}/gen.sh", payload, "1024", "${workdir}/payload.json"]
      - command: [sh, "${head_root}/gen.sh", keys, "${artifact}", "${workdir}"]
      - command:
          - sh
          - -c
          - |
            set -e
            "$1" jwe encrypt --key "$2/ec.jwk" -K ECDH-ES -c A256GCM "$2/payload.json" > "$2/ecdh-es.jwe"
            "$1" jwe encrypt --key "$2/rsa.jwk" -K RSA-OAEP-256 -c A256GCM "$2/payload.json" > "$2/rsa-oaep-256.jwe"
            "$1" jwe encrypt --key "$2/oct.jwk" -K A256KW -c A256GCM "$2/payload.json" > "$2/a256kw.jwe"
            "$1" jwe encrypt --key "$2/ec.jwk" -K ECDH-ES -c A256GCM --compress "$2/payload.json" > "$2/compress.jwe"
          - sh
          - "${artifact}"
          - "${workdir}"
    baseline: ecdh-es
    commands:
      ecdh-es:
        command: ["${artifact}", jwe, decrypt, --key, "${workdir}/ec.jwk", "${workdir}/ecdh-es.jwe"]
      rsa-oaep-256:
        command: ["${artifact}", jwe, decrypt, --key, "${workdir}/rsa.jwk", "${workdir}/rsa-oaep-256.jwe"]
      a256kw:
        command: ["${artifact}", jwe, decrypt, --key, "${workdir}/oct.jwk", "${workdir}/a256kw.jwe"]
      compress:
        command: ["${artifact}", jwe, decrypt, --key, "${workdir}/ec.jwk", "${workdir}/compress.jwe"]

  - name: jwe decrypt 10mb
    description: A compact JWE of a 10 MiB payload decrypted, for each way jwe encrypt 10mb encrypts.
    tags: [large]
    setup:
      - command: [sh, "${head_root}/gen.sh", payload, "10485760", "${workdir}/payload.json"]
      - command: [sh, "${head_root}/gen.sh", keys, "${artifact}", "${workdir}"]
      - command:
          - sh
          - -c
          - |
            set -e
            "$1" jwe encrypt --key "$2/ec.jwk" -K ECDH-ES -c A256GCM "$2/payload.json" > "$2/ecdh-es.jwe"
            "$1" jwe encrypt --key "$2/rsa.jwk" -K RSA-OAEP-256 -c A256GCM "$2/payload.json" > "$2/rsa-oaep-256.jwe"
            "$1" jwe encrypt --key "$2/oct.jwk" -K A256KW -c A256GCM "$2/payload.json" > "$2/a256kw.jwe"
            "$1" jwe encrypt --key "$2/ec.jwk" -K ECDH-ES -c A256GCM --compress "$2/payload.json" > "$2/compress.jwe"
          - sh
          - "${artifact}"
          - "${workdir}"
    baseline: ecdh-es
    metrics:
      throughput:
        work:
          file_size: "${workdir}/payload.json"
    commands:
      ecdh-es:
        command: ["${artifact}", jwe, decrypt, --key, "${workdir}/ec.jwk", "${workdir}/ecdh-es.jwe"]
      rsa-oaep-256:
        command: ["${artifact}", jwe, decrypt, --key, "${workdir}/rsa.jwk", "${workdir}/rsa-oaep-256.jwe"]
      a256kw:
        command: ["${artifact}", jwe, decrypt, --key, "${workdir}/oct.jwk", "${workdir}/a256kw.jwe"]
      compress:
        command: ["${artifact}", jwe, decrypt, --key, "${workdir}/ec.jwk", "${workdir}/compress.jwe"]

  - name: jwe decrypt error
    description: A JWE decrypted with an EC key other than the recipient's, which fails with exit 1.
    tags: [smoke]
    setup:
      - command: [sh, "${head_root}/gen.sh", payload, "1024", "${workdir}/payload.json"]
      - command: [sh, "${head_root}/gen.sh", keys, "${artifact}", "${workdir}"]
      - command: [sh, -c, '"$1" jwe encrypt --key "$2/ec.jwk" -K ECDH-ES -c A256GCM "$2/payload.json" > "$2/ecdh-es.jwe"', sh, "${artifact}", "${workdir}"]
    exit_codes: [1]
    commands:
      jose:
        command: ["${artifact}", jwe, decrypt, --key, "${workdir}/other-ec.jwk", "${workdir}/ecdh-es.jwe"]
